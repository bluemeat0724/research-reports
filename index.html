 var tags=(r.tags||[]).map(function(x){return"<span>"+esc(x)+"</span>";}).join("");
 return '<article class="card">'
 +'<div class="meta"><span class="kind" style="--k:'+t.color+'">'+pad(numOf[r.title])+' · '+t.name+'</span><time datetime="'+r.date+'">'+r.date+'</time></div>'
 +'<h2><a href="'+r.url+'" target="_blank" rel="noopener noreferrer">'+esc(r.title)+'</a></h2>'
 +(r.en?'<p class="en">'+esc(r.en)+'</p>':"")
 +'<p class="sum">'+esc(r.summary)+'</p>'
 +(tags?'<div class="tags">'+tags+'</div>':"")
 +'<div class="foot"><a class="read" href="'+r.url+'" target="_blank" rel="noopener noreferrer">阅读 →</a><span class="fmt">'+fmt+'</span></div>'
 +'</article>';
}

function render(){
 var filtered=REPORTS.filter(matches);
 var catsToShow=(state.cat==="all")?CATS:[catByKey[state.cat]];
 var html="";
 catsToShow.forEach(function(c){
  var items=filtered.filter(function(r){return r.category===c.key;})
   .sort(function(a,b){return b.date.localeCompare(a.date);});
  if(!items.length)return;
  html+='<section id="cat-'+c.key+'"><div class="sec-head"><h2>'+esc(c.name)+'</h2><span class="en">'+c.en+'</span><span class="n">'+items.length+' 篇</span></div>'
   +'<div class="grid">'+items.map(cardHTML).join("")+'</div></section>';
 });
 document.getElementById("sections").innerHTML=html;
 document.getElementById("empty").hidden=filtered.length>0;
 document.getElementById("result").textContent=(filtered.length===REPORTS.length)
  ?("收录 "+REPORTS.length+" 篇 · "+CATS.length+" 个分类")
  :("匹配 "+filtered.length+" / "+REPORTS.length+" 篇");
 syncChips();
}

function chipHTML(attr,k,n,c){return'<button class="chip" type="button" '+attr+'="'+k+'" aria-pressed="false">'+esc(n)+' <span class="n">'+c+'</span></button>';}
function buildChips(){
 var tItems=[["all","全部",REPORTS.length]];
 for(key in TYPES){if(TYPES.hasOwnProperty(key))tItems.push([key,TYPES[key].name,REPORTS.filter(function(r){return r.type===key;}).length]);}
 document.getElementById("type-chips").innerHTML=tItems.map(function(it){return chipHTML("data-type",it[0],it[1],it[2]);}).join("");
 var cItems=[["all","全部分类",REPORTS.length]];
 CATS.forEach(function(c){cItems.push([c.key,c.name,REPORTS.filter(function(r){return r.category===c.key;}).length]);});
 document.getElementById("cat-chips").innerHTML=cItems.map(function(it){return chipHTML("data-cat",it[0],it[1],it[2]);}).join("");
}
function syncChips(){
 document.querySelectorAll("#type-chips .chip").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-type")===state.type));});
 document.querySelectorAll("#cat-chips .chip").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-cat")===state.cat));});
}
function syncHash(){
 try{history.replaceState(null,"",state.cat==="all"?location.pathname+location.search:"#"+state.cat);}catch(e){}
}

function initStats(){
 var nInt=REPORTS.filter(function(r){return r.type==="interactive";}).length;
 var nRep=REPORTS.filter(function(r){return r.type==="report";}).length;
 var nGuide=REPORTS.filter(function(r){return r.type==="guide";}).length;
 var dates=REPORTS.map(function(r){return r.date;}).sort();
 var d=new Date(dates[dates.length-1]+"T00:00:00");
 var mon=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][d.getMonth()];
 document.getElementById("stat-line").textContent=REPORTS.length+" PAGES · "+nRep+" REPORTS · "+nInt+" INTERACTIVE · "+nGuide+" GUIDES · "+CATS.length+" TOPICS · UPDATED "+mon+" "+d.getFullYear();
}

document.getElementById("type-chips").addEventListener("click",function(e){
 var b=e.target.closest(".chip");if(!b)return;
 state.type=b.getAttribute("data-type");render();
});
document.getElementById("cat-chips").addEventListener("click",function(e){
 var b=e.target.closest(".chip");if(!b)return;
 state.cat=b.getAttribute("data-cat");render();syncHash();
});
document.getElementById("q").addEventListener("input",function(e){state.q=e.target.value.trim();render();});
document.getElementById("reset").addEventListener("click",function(){
 state={q:"",cat:"all",type:"all"};document.getElementById("q").value="";render();syncHash();
});
document.addEventListener("keydown",function(e){
 if(e.key==="/"&&document.activeElement!==document.getElementById("q")){e.preventDefault();document.getElementById("q").focus();}
});

var h=location.hash.replace("#","");
if(catByKey[h])state.cat=h;

initStats();
buildChips();
render();
})();
</script>
</body>
</html>
